[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[project]
name = "xchem-hippo"
version = "2.0.5"
authors = [
    { name = "Max Winokan", email = "max@winokan.com" },
    { name = "Kalev Takkis", email = "ktakkis@informaticsmatters.com" },
]
description = "Hit Interaction Profiling and Procurement Optimisation"
readme = "README.md"
# Lower bound: xchem-ta-auth-client declares requires-python >=3.13.
#
# Deliberately NO upper bound, even though xchem-syndirella currently declares
# <3.14. Adding one would achieve nothing and cost something:
#   - it changes no outcome. On 3.14 pip lands on the ancient 1.0.5 either way
#     -- with a cap because 2.x is filtered out, without one because pip
#     backtracks past the unsatisfiable xchem-syndirella. Measured, not assumed.
#   - published metadata is immutable, so a cap here would block 3.14 forever,
#     including after syndirella gains 3.14 support. Without one, released
#     versions start working on 3.14 by themselves once that happens.
# This is exactly the trap syndirella's own stale <3.11 cap set for this project
# -- don't repeat it. Cap only when a version is genuinely known to be broken.
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rdkit==2025.9.5",
    "molparse>=0.0.41",
    "mpytools>=0.0.21",
    "jupyterlab>=4.5",
    "chardet>=7",
    "pandas>=2.3",
    "yattag>=1.16",       # html widget rendering, possibly to be removed
    "hirsch>=0.1",        # used?
    "hippo_plot>=0.0.1",
    "scikit-learn>=1.7",
    "openpyxl>=3.1",
    "ipywidgets>=8.1",
    "networkx>=3.4",
    # Not imported by HIPPO -- carried for molparse, whose protonate.py imports
    # openmm.app and pdbfixer lazily without declaring either. Floor is 8.3
    # rather than 8.4 (which was an incidental pin-to-current, not an API
    # requirement) so conda-forge/miniforge users on 8.3.x are not forced into a
    # PyPI build over the top of theirs. pdbfixer itself only needs >=8.2, and
    # the APIs molparse uses predate both. Do not pin exactly: only 8.5.x ships
    # linux aarch64 wheels, which [tool.uv] required-environments demands.
    "openmm>=8.3",
    "apsw>=3.51",
    "python-louvain>=0.16",
    "psycopg[binary]>=3.3",
    "django>=5.2.12,<6",
    "typer>=0.24.1",      # used?
    "neo4j>=6.1.0",
    "gemmi>=0.7.5",
    "mrich>=1.0",
    "requests>=2.32",
    "pdbfixer>=1.12.0",
    "xchem-ta-auth-client>=1.0.0",
    "numpy>=2",
    "xchem-syndirella>=1.0.6",
    # original HIPPO depends on this. cannot install with uv, comes from conda
    # "chemicalite==2024.5.1",
    # options:
    # - this is probably present in diamond environments,
    # - can use conda install in container
    # - but.. probs don't even need it, it's only used for expressions and I got that covered
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "ruff>=0.15.2",
    "ty>=0.0.19",
    "mypy>=1.19",
    "commitizen>=4.13.5,<5",
    "pre-commit>=4.5.1",
    "pytest-cov>=7",
]

[tool.commitizen]
name = "cz_customize"
version_provider = "scm"
version_scheme = "semver2"
annotated_tag = true
update_changelog_on_bump = true
changelog_merge_prerelease = true
prerelease_offset = 1
pre_bump_hooks = ["./add-issue-links-to-changelog.sh"]

[tool.commitizen.customize]
bump_pattern = '^(feat|fix|ci|build|perf|refactor|chore|remove|style|test)'
bump_map = {feat = "MINOR", fix = "PATCH", ci = "PATCH", build = "PATCH", perf = "PATCH", refactor = "PATCH", chore = "PATCH", remove = "PATCH", style = "PATCH", test = "PATCH" }
schema_pattern = "(build|bump|chore|ci|dev|docs|feat|fix|perf|refactor|remove|style|test):(\\s.*)"
commit_parser = "^(?P<change_type>build|bump|chore|ci|dev|docs|feat|fix|perf|refactor|remove|style|test):\\s(?P<message>.*)?"
# By excluding 'bump', 'ci', 'dev', and 'docs' from
# 'change_type_map', 'change_type_order' and 'changelog_pattern'
# we omit the corresponding commit comments from the CHANGELOG.
# The order of types in the CHANGELOG is dictated by the type_order
change_type_map = {"feat" = "New Features", "fix" = "Bug Fixes", "perf" = "Performance Improvements", "refactor" = "Refactoring", "chore" = "General Improvements", "remove" = "Removed", "style" = "Stylistic Changes", "test" = "Testing", "build" = "Build"}
change_type_order = ["BREAKING CHANGE", "New Features", "Bug Fixes", "Performance Improvements", "Refactoring", "General Improvements", "Removed", "Stylistic Changes", "Testing", "Build"]
changelog_pattern = "^(build|chore|feat|fix|perf|refactor|remove|style|test)"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
  "tests",
  "migrations",
  # "hippo",
  "hippo_legacy",
]
force-exclude = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # import sort
  "UP",  # pyupgrade
  "B",   # bugbear
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.format]
quote-style = "single"

[tool.ty.src]
exclude = [
    "migrations",
    "tests",
    # "hippo",
    "hippo_legacy",
]

[tool.pytest.ini_options]
# hippo is not an installed package; it's imported from the repo root (the
# scripts rely on cwd being on sys.path). Put the repo root on sys.path so
# `import hippo` works under pytest. `tests/` is added automatically by the
# tests/conftest.py, which is what makes `from config import *` resolve.
pythonpath = ["."]
markers = [
    "sqlite: container-free tests that run in SQLite mode (no Postgres/Fragalysis). Run with `pytest -m sqlite`. They also run against Postgres with HIPPO_TEST_DB=postgres.",
    "postgres: tests that need the DesignDB Postgres schema (RDKit cartridge, triggers, materialized view). Skipped unless HIPPO_TEST_DB=postgres; see tests/postgres/start_db.sh.",
]

[tool.coverage.run]
# a path, not a module: hippo's subpackages are imported as top-level modules
# (`designdb`, ...), so `--cov=hippo` would miss them
source = ["hippo"]
branch = true

[tool.coverage.report]
skip_empty = true
sort = "cover"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.build-backend]
module-name = "hippo"
module-root = ""
