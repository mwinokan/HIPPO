---
name: Lint

on:
  push:
    branches:
    - '*'
    tags-ignore:
    - '*'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    - name: Repeat pre-commit
      run: uv run pre-commit run --all-files
