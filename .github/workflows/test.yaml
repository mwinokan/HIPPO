---
name: Test

on:
  push:
    branches:
    - '*'
    tags-ignore:
    - '*'
  pull_request:

permissions:
  contents: read

jobs:
  # Container-free tier: SQLite, no Postgres or Fragalysis.
  # Runs on every supported Python; other jobs use the .python-version default.
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        # sets UV_PYTHON, which overrides .python-version
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: uv sync --frozen
    - name: Test
      run: make coverage
    - name: Coverage summary
      if: always()
      run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # The same tests plus the Postgres-only ones, against the DesignDB schema on a
  # Postgres with the RDKit cartridge. Versions match images/xchem-designdb.
  postgres:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Postgres with the RDKit cartridge
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: designdb-test
        create-args: >-
          -c conda-forge
          postgresql=18
          rdkit-postgresql=2025.09.5
        cache-environment: true
    # a login shell activates the env; not `micromamba run`, which waits on the
    # server the script leaves running and never returns
    - name: Start DesignDB
      shell: bash -el {0}
      run: tests/postgres/start_db.sh
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    - name: Test
      run: make test-postgres PYTEST_ARGS="--cov --cov-report=term"
    - name: Coverage summary
      if: always()
      run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
